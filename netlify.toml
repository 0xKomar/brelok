[build]
  base = "products/brelock/apps/website"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Run the Next.js adapter even when this existing site was detected as static.
[[plugins]]
  package = "@netlify/plugin-nextjs"
