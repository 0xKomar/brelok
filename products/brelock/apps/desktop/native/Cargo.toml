[workspace]
members = ["crates/core", "crates/platform", "crates/app", "crates/shell"]
default-members = ["crates/core", "crates/platform", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1"
btleplug = "=0.13.3"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
brelock-core = { path = "crates/core" }
brelock-platform = { path = "crates/platform" }

[profile.release]
strip = true
lto = "thin"
