name: Desktop app and backend

on:
  push:
    paths:
      - 'products/brelock/apps/desktop/native/**'
      - '.github/workflows/desktop-native.yml'
  pull_request:
    paths:
      - 'products/brelock/apps/desktop/native/**'
      - '.github/workflows/desktop-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: products/brelock/apps/desktop/native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install UI dependencies
        working-directory: products/brelock/apps/desktop/native/ui
        run: npm ci
      - name: Test UI presentation
        working-directory: products/brelock/apps/desktop/native/ui
        run: npm test
      - name: Build UI before Rust checks
        working-directory: products/brelock/apps/desktop/native/ui
        run: npm run build
      - name: Formatting
        run: cargo fmt --all --check
      - name: Static checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests without Bluetooth hardware
        run: cargo test --workspace --locked
      - name: Build native executable
        run: cargo build --release --locked -p brelock-desktop
      - name: Build macOS Universal binary
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p brelock-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p brelock-desktop --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/brelock-desktop target/x86_64-apple-darwin/release/brelock-desktop -output target/release/brelock-desktop
      - name: Smoke test macOS Universal executable
        if: runner.os == 'macOS'
        run: ./target/release/brelock-desktop demo --duration 0.6
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: ./target/release/brelock-desktop.exe demo --duration 0.6
      - name: Package macOS desktop app
        if: runner.os == 'macOS'
        working-directory: products/brelock/apps/desktop/native/ui
        run: npm run desktop:build -- --bundles app -- --locked
      - name: Package Windows desktop app
        if: runner.os == 'Windows'
        working-directory: products/brelock/apps/desktop/native/ui
        run: npm run desktop:build -- --bundles nsis -- --locked
      - name: Archive macOS app with executable permission
        if: runner.os == 'macOS'
        run: tar -czf target/brelock-app-macos.tar.gz -C target/release/bundle/macos breLock.app
      - name: Store desktop app
        uses: actions/upload-artifact@v7
        with:
          name: brelock-app-${{ runner.os }}-${{ runner.arch }}
          path: |
            products/brelock/apps/desktop/native/target/brelock-app-macos.tar.gz
            products/brelock/apps/desktop/native/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Archive macOS binary with executable permission
        if: runner.os == 'macOS'
        run: tar -czf target/brelock-desktop-macos.tar.gz -C target/release brelock-desktop
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/brelock-desktop.exe -DestinationPath target/brelock-desktop-windows.zip
      - name: Store executable
        uses: actions/upload-artifact@v7
        with:
          name: brelock-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            products/brelock/apps/desktop/native/target/brelock-desktop-macos.tar.gz
            products/brelock/apps/desktop/native/target/brelock-desktop-windows.zip
          if-no-files-found: error
